<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#071b2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23071b2e'/%3E%3Ccircle cx='32' cy='29' r='18' fill='none' stroke='%23e8c16b' stroke-width='3'/%3E%3Cpath d='M18 49h28' stroke='%23e8c16b' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='27' cy='26' r='2' fill='white'/%3E%3Ccircle cx='38' cy='20' r='2' fill='white'/%3E%3C/svg%3E">
  <title>きなこのクリスマス・スノードーム</title>
  <meta name="description" content="傾けて、振って、雪が舞う。きなこのクリスマス・スノードーム。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app">
    <div class="background-sparkles" aria-hidden="true">
      <i class="bg-star" style="--x:7%;--y:14%;--size:12px;--duration:3.8s;--delay:-1.2s"></i>
      <i class="bg-star" style="--x:19%;--y:31%;--size:8px;--duration:4.6s;--delay:-2.8s"></i>
      <i class="bg-star" style="--x:87%;--y:16%;--size:15px;--duration:4.1s;--delay:-.6s"></i>
      <i class="bg-star" style="--x:94%;--y:38%;--size:9px;--duration:3.4s;--delay:-2.1s"></i>
      <i class="bg-star" style="--x:8%;--y:52%;--size:17px;--duration:5.2s;--delay:-3.3s"></i>
      <i class="bg-star" style="--x:90%;--y:58%;--size:11px;--duration:3.9s;--delay:-1.7s"></i>
      <i class="bg-star" style="--x:14%;--y:73%;--size:10px;--duration:4.8s;--delay:-.9s"></i>
      <i class="bg-star" style="--x:84%;--y:76%;--size:16px;--duration:4.3s;--delay:-2.5s"></i>
      <i class="bg-star" style="--x:30%;--y:19%;--size:7px;--duration:3.6s;--delay:-1.9s"></i>
      <i class="bg-star" style="--x:70%;--y:28%;--size:10px;--duration:5.1s;--delay:-3.8s"></i>
      <i class="bg-star" style="--x:6%;--y:87%;--size:13px;--duration:4.5s;--delay:-2.4s"></i>
      <i class="bg-star" style="--x:92%;--y:89%;--size:8px;--duration:3.7s;--delay:-1.1s"></i>
      <i class="bg-star" style="--x:34%;--y:84%;--size:9px;--duration:5.4s;--delay:-4.2s"></i>
      <i class="bg-star" style="--x:72%;--y:69%;--size:12px;--duration:4.2s;--delay:-3s"></i>
      <i class="bg-star" style="--x:45%;--y:11%;--size:8px;--duration:4.9s;--delay:-2.2s"></i>
      <i class="bg-star" style="--x:59%;--y:90%;--size:14px;--duration:3.5s;--delay:-.4s"></i>
      <i class="bg-star" style="--x:25%;--y:9%;--size:11px;--duration:3.4s;--delay:-1.3s"></i>
      <i class="bg-star" style="--x:77%;--y:8%;--size:9px;--duration:3.7s;--delay:-2.6s"></i>
      <i class="bg-star" style="--x:4%;--y:25%;--size:14px;--duration:4.1s;--delay:-.7s"></i>
      <i class="bg-star" style="--x:96%;--y:26%;--size:12px;--duration:3.3s;--delay:-1.8s"></i>
      <i class="bg-star" style="--x:12%;--y:42%;--size:8px;--duration:3.6s;--delay:-2.4s"></i>
      <i class="bg-star" style="--x:82%;--y:45%;--size:10px;--duration:4s;--delay:-1.1s"></i>
      <i class="bg-star" style="--x:5%;--y:65%;--size:9px;--duration:3.2s;--delay:-2s"></i>
      <i class="bg-star" style="--x:96%;--y:67%;--size:15px;--duration:3.8s;--delay:-.5s"></i>
      <i class="bg-star" style="--x:22%;--y:92%;--size:8px;--duration:3.5s;--delay:-2.9s"></i>
      <i class="bg-star" style="--x:78%;--y:94%;--size:11px;--duration:4.2s;--delay:-1.5s"></i>
      <i class="bg-star" style="--x:38%;--y:35%;--size:7px;--duration:3.1s;--delay:-.8s"></i>
      <i class="bg-star" style="--x:64%;--y:54%;--size:9px;--duration:3.9s;--delay:-2.2s"></i>
    </div>

    <header class="brand" aria-label="きなこのクリスマス">
      <h1 class="sr-only">Merry Christmas from KINAKO</h1>
      <img src="assets/christmas-logo.png" alt="Merry Christmas from KINAKO" draggable="false">
    </header>

    <section class="globe-wrap" id="globeWrap" aria-label="インタラクティブなスノードーム">
      <img class="globe-art" src="assets/kinako-snow-globe.png" alt="サンタ姿のきなこが入ったクリスマススノードーム" draggable="false">
      <div class="globe" id="globe">
        <canvas id="snowCanvas" aria-hidden="true"></canvas>
      </div>
    </section>

    <div class="hint" id="hint" role="status">
      <span class="hint-icon">↔</span>
      <span>スマホを傾けて、振ってみてね</span>
    </div>

    <nav class="controls" aria-label="スノードーム操作">
      <button class="control-btn" id="shakeBtn" type="button"><span>✦</span> 雪を舞わせる</button>
      <button class="icon-btn" id="infoBtn" type="button" aria-label="使い方を見る">?</button>
    </nav>

    <section class="tutorial is-open" id="tutorial" aria-label="使い方">
      <div class="tutorial-blur" aria-hidden="true"></div>
      <div class="tutorial-card">
        <button class="skip-btn" id="skipBtn" type="button">スキップ</button>
        <div class="tutorial-visual" aria-hidden="true">
          <img id="tutorialImage" src="assets/tutorial-tilt.png" alt="" draggable="false">
        </div>
        <p class="step-count" id="stepCount">01 / 03</p>
        <h2 id="tutorialTitle">傾けてみよう</h2>
        <p id="tutorialText">スマホを左右に傾けると、雪と金色の光が重力に合わせて動きます。</p>
        <div class="dots" aria-hidden="true"><i class="active"></i><i></i><i></i></div>
        <div class="tutorial-actions">
          <button class="tutorial-image-btn back-image-btn" id="backBtn" type="button" hidden>
            <img src="assets/tutorial-back.png" alt="" draggable="false">
            <span class="sr-only">もどる</span>
          </button>
          <button class="tutorial-image-btn forward-image-btn" id="nextBtn" type="button">
            <img class="forward-next-art" src="assets/tutorial-next.png" alt="" draggable="false">
            <img class="forward-start-art" src="assets/tutorial-start.png" alt="" draggable="false">
            <span class="sr-only" id="forwardButtonLabel">次へ</span>
          </button>
        </div>
      </div>
    </section>

    <div class="permission-sheet" id="permissionSheet" role="dialog" aria-modal="true" aria-labelledby="permissionTitle" hidden>
      <div class="permission-card">
        <span class="permission-icon">◒</span>
        <h2 id="permissionTitle">動きをもっと楽しむ</h2>
        <p>傾きや振動に反応させるため、iPhoneの「動作と方向」へのアクセスを許可してください。データは保存・送信されません。</p>
        <button class="next-btn" id="allowMotionBtn" type="button">センサーを許可</button>
        <button class="text-btn" id="touchOnlyBtn" type="button">タッチ操作だけで遊ぶ</button>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#071b2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23071b2e'/%3E%3Ccircle cx='32' cy='29' r='18' fill='none' stroke='%23e8c16b' stroke-width='3'/%3E%3Cpath d='M18 49h28' stroke='%23e8c16b' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='27' cy='26' r='2' fill='white'/%3E%3Ccircle cx='38' cy='20' r='2' fill='white'/%3E%3C/svg%3E">
  <title>きなこのクリスマス・スノードーム</title>
  <meta name="description" content="傾けて、振って、雪が舞う。きなこのクリスマス・スノードーム。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app">
    <header class="brand" aria-label="きなこのクリスマス">
      <h1 class="sr-only">Merry Christmas from KINAKO</h1>
      <img src="assets/christmas-logo.png" alt="Merry Christmas from KINAKO" draggable="false">
    </header>

    <section class="globe-wrap" id="globeWrap" aria-label="インタラクティブなスノードーム">
      <img class="globe-art" src="assets/kinako-snow-globe.png" alt="サンタ姿のきなこが入ったクリスマススノードーム" draggable="false">
      <div class="globe" id="globe">
        <canvas id="snowCanvas" aria-hidden="true"></canvas>
      </div>
    </section>

    <div class="hint" id="hint" role="status">
      <span class="hint-icon">↔</span>
      <span>スマホを傾けて、振ってみてね</span>
    </div>

    <nav class="controls" aria-label="スノードーム操作">
      <button class="control-btn" id="shakeBtn" type="button"><span>✦</span> 雪を舞わせる</button>
      <button class="icon-btn" id="infoBtn" type="button" aria-label="使い方を見る">?</button>
    </nav>

    <section class="tutorial is-open" id="tutorial" aria-label="使い方">
      <div class="tutorial-blur" aria-hidden="true"></div>
      <div class="tutorial-card">
        <button class="skip-btn" id="skipBtn" type="button">スキップ</button>
        <div class="tutorial-visual" id="tutorialVisual" aria-hidden="true"></div>
        <p class="step-count" id="stepCount">01 / 03</p>
        <h2 id="tutorialTitle">傾けてみよう</h2>
        <p id="tutorialText">スマホを左右に傾けると、雪と金色の光が重力に合わせて動きます。</p>
        <div class="dots" aria-hidden="true"><i class="active"></i><i></i><i></i></div>
        <button class="next-btn" id="nextBtn" type="button">次へ <span>→</span></button>
      </div>
    </section>

    <div class="permission-sheet" id="permissionSheet" role="dialog" aria-modal="true" aria-labelledby="permissionTitle" hidden>
      <div class="permission-card">
        <span class="permission-icon">◒</span>
        <h2 id="permissionTitle">動きをもっと楽しむ</h2>
        <p>傾きや振動に反応させるため、iPhoneの「動作と方向」へのアクセスを許可してください。データは保存・送信されません。</p>
        <button class="next-btn" id="allowMotionBtn" type="button">センサーを許可</button>
        <button class="text-btn" id="touchOnlyBtn" type="button">タッチ操作だけで遊ぶ</button>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>

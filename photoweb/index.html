<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#071a42">
  <title>黒字化記念フォトフレーム</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="frame-selection" id="frameSelection">
    <header class="selection-header">
      <p>KUROJI CELEBRATION</p>
      <h1>フレームを選んでください</h1>
    </header>

    <div class="frame-options">
      <button class="frame-option" data-frame="./assets/frame-premium.png?v=4">
        <span class="frame-thumbnail"><img src="./assets/frame-premium.png?v=4" alt="ゴールドの黒字化記念フレーム"></span>
        <strong>プレミアム</strong>
      </button>
      <button class="frame-option" data-frame="./assets/frame-pop-tekkuma.png?v=4">
        <span class="frame-thumbnail"><img src="./assets/frame-pop-tekkuma.png?v=4" alt="クマを使ったポップな黒字化記念フレーム"></span>
        <strong>てっくまポップ</strong>
      </button>
    </div>
  </main>

  <main class="camera-app" id="cameraApp" hidden>
    <div class="camera-view" id="cameraView">
      <video id="camera" autoplay muted playsinline></video>
      <img id="photo" class="photo" alt="撮影した写真">

      <!-- デザインは透明PNG。差し替える場合は、この画像だけ変更 -->
      <img class="frame-image" id="frameImage" alt="">

      <div class="flash" id="flash"></div>
      <p class="error" id="error" role="alert"></p>
    </div>

    <div class="controls" id="shootControls">
      <button id="switchCamera" class="control-button" aria-label="カメラを切り替える">↺</button>
      <button id="shutter" class="shutter" aria-label="撮影する"></button>
      <span class="control-spacer"></span>
    </div>

    <div class="result-controls" id="resultControls" hidden>
      <button id="retake" class="result-button">撮り直す</button>
      <button id="save" class="result-button result-button--primary">保存・共有</button>
      <button id="backToIndex" class="result-button result-button--back">フレーム選択に戻る</button>
    </div>
  </main>

  <canvas id="output" width="1080" height="1440" hidden></canvas>
  <script src="./js/camera.js?v=4"></script>
</body>
</html>

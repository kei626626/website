<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>そらの島鉄道</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  :root{
    --glass: rgba(248,251,253,.74); --glass-edge: rgba(255,255,255,.65);
    --ink:#15202b; --muted:#4b5a68; --accent:#0d5e6c; --accent-deep:#083f49; --sky:#c4d8e8;
    color-scheme: light;
  }
  html,body{height:100%;}
  body{margin:0;background:var(--sky);color:var(--ink);overflow:hidden;
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;}
  #stage{position:fixed;inset:0;}
  #c{display:block;width:100%;height:100%;touch-action:none;outline:none;}
  .panel{background:var(--glass);border:1px solid var(--glass-edge);border-radius:12px;
    -webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15);
    box-shadow:0 8px 28px rgba(12,28,44,.14);}
  .plate{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));padding:12px 18px 12px;max-width:calc(100% - 32px);}
  .plate h1{margin:0;font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif;font-weight:800;font-size:22px;letter-spacing:.08em;line-height:1.2;}
  .status{margin:6px 0 0;font-size:13px;color:var(--muted);font-weight:700;display:flex;gap:8px;align-items:center;min-height:18px;letter-spacing:.02em;}
  .lamp{width:7px;height:7px;border-radius:50%;background:#2f9e6a;box-shadow:0 0 0 3px rgba(47,158,106,.18);flex:none;}
  .lamp.stop{background:#c8483a;box-shadow:0 0 0 3px rgba(200,72,58,.18);}
  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 32px);}
  .seg{display:flex;padding:5px;gap:3px;flex-wrap:wrap;justify-content:center;}
  button{font:inherit;font-weight:700;font-size:14px;border:0;cursor:pointer;color:var(--ink);background:transparent;
    padding:9px 14px;border-radius:8px;transition:background .15s,color .15s;letter-spacing:.03em;}
  button:hover{background:rgba(13,94,108,.08);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;}
  .solo{padding:14px 16px;}
  .solo[aria-pressed="true"]{background:var(--accent-deep);color:#fff;}
  .hint{position:fixed;right:16px;top:calc(18px + env(safe-area-inset-top,0px));font-size:12px;color:var(--muted);padding:7px 11px;font-weight:700;}
  .loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--sky);font-family:"Shippori Mincho B1",serif;font-size:18px;letter-spacing:.2em;color:var(--muted);transition:opacity .6s;}
  .loading.done{opacity:0;pointer-events:none;}
  @media (max-width:640px){
    .hint{display:none;}
    .plate h1{font-size:18px;}
    button{padding:8px 10px;font-size:13px;}
    .solo{padding:12px;}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="空に浮かぶ島々を蒸気機関車が走る3Dシーン"></canvas></div>

<div class="plate panel">
  <h1>そらの島鉄道</h1>
  <p class="status"><span class="lamp" id="lamp"></span><span id="status">発車します</span></p>
</div>
<div class="hint panel">ドラッグで回転 ・ ホイールでズーム</div>

<div class="dock">
  <div class="seg panel" role="group" aria-label="視点">
    <button id="v-orbit" aria-pressed="true">ながめる</button>
    <button id="v-follow" aria-pressed="false">おいかける</button>
    <button id="v-cab" aria-pressed="false">うんてんせき</button>
    <button id="v-sea" aria-pressed="false">うみのなか</button>
  </div>
  <button class="solo panel" id="pause" aria-pressed="false">一時停止</button>
</div>
<div class="loading" id="loading">島をつくっています…</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/objects/Sky.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/math/SimplexNoise.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(function(){
'use strict';
THREE.ColorManagement.legacyMode = false;
const TAU = Math.PI*2;
let seed = 424242;
const rnd = () => (seed = (seed*16807) % 2147483647, (seed-1)/2147483646);
const R = (a,b) => a + (b-a)*rnd();
const pick = a => a[Math.floor(rnd()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const sstep = (e0,e1,x) => { const t = clamp((x-e0)/(e1-e0), 0, 1); return t*t*(3-2*t); };
const SN = new THREE.SimplexNoise({random: rnd});
const n2 = (x,y) => SN.noise(x,y);
function fbm(x,y,o=4){ let a=0.5, s=0, f=1; for(let i=0;i<o;i++){ s += a*SN.noise(x*f + i*17.3, y*f - i*9.1); f *= 2.02; a *= 0.5; } return s; }
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const small = Math.min(innerWidth, innerHeight) < 700;
const BGU = THREE.BufferGeometryUtils;

/* ---------- renderer ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, small ? 1.25 : 1.5));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAXANI = Math.min(8, renderer.capabilities.getMaxAnisotropy());
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.3, 9000);
camera.position.set(430, 240, 480);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0, -25, 0);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 25; controls.maxDistance = 1300;
controls.maxPolarAngle = Math.PI*0.64;
controls.autoRotate = !reduceMotion; controls.autoRotateSpeed = 0.25;
controls.addEventListener('start', () => { controls.autoRotate = false; });
const U = {time:{value:0}};

/* ---------- sky, sun, environment ---------- */
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(54), THREE.MathUtils.degToRad(140));
function makeSky(){
  const s = new THREE.Sky(); s.scale.setScalar(7000);
  const u = s.material.uniforms;
  u.turbidity.value = 3.2; u.rayleigh.value = 1.35; u.mieCoefficient.value = 0.004; u.mieDirectionalG.value = 0.86;
  u.sunPosition.value.copy(sunDir);
  return s;
}
const sky = makeSky(); scene.add(sky);
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene(); envScene.add(makeSky());
  scene.environment = pmrem.fromScene(envScene).texture;
}
const sun = new THREE.DirectionalLight(new THREE.Color('#fff0dc'), 2.4);
sun.position.copy(sunDir).multiplyScalar(700);
sun.castShadow = true;
sun.shadow.mapSize.set(small ? 2048 : 4096, small ? 2048 : 4096);
Object.assign(sun.shadow.camera, {left:-340, right:340, top:340, bottom:-340, near:100, far:1500});
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.12;
scene.add(sun); scene.add(sun.target);
scene.add(new THREE.HemisphereLight(new THREE.Color('#dbe8f5'), new THREE.Color('#6d6452'), 0.25));
// fog colours are written in display space (fog is applied after tone mapping)
const AIR = {col: new THREE.Color().setRGB(0.78,0.86,0.94), density: 0.00036};
const WATERFOG = {col: new THREE.Color().setRGB(0.05,0.30,0.36), density: 0.05};
scene.fog = new THREE.FogExp2(0xffffff, AIR.density); scene.fog.color.copy(AIR.col);

/* ---------- GLSL helpers ---------- */
const GLSL_NOISE = `
vec3 sn_perm(vec3 x){ return mod(((x*34.0)+1.0)*x, 289.0); }
float snoise2(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy)); vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
  vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1; i = mod(i, 289.0);
  vec3 p = sn_perm(sn_perm(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0); m = m*m; m = m*m;
  vec3 x = 2.0*fract(p*C.www) - 1.0; vec3 h = abs(x) - 0.5; vec3 ox = floor(x + 0.5); vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314*(a0*a0 + h*h);
  vec3 g; g.x = a0.x*x0.x + h.x*x0.y; g.yz = a0.yz*x12.xz + h.yz*x12.yw;
  return 130.0*dot(m, g);
}
float caustic(vec2 p, float t){
  float a = 1.0 - abs(snoise2(p*0.32 + vec2(t*0.11, t*0.06)));
  float b = 1.0 - abs(snoise2(p*0.41 + vec2(-t*0.08, t*0.10) + 7.3));
  return pow(a, 7.0)*0.55 + pow(b, 7.0)*0.55 + pow(min(a,b), 3.0)*0.35;
}
`;

/* ---------- procedural textures ---------- */
function tileN(u,v,fu,fv){ const a=u*TAU, b=v*TAU, ru=fu/TAU, rv=fv/TAU; return SN.noise4d(Math.cos(a)*ru, Math.sin(a)*ru, Math.cos(b)*rv, Math.sin(b)*rv); }
function canvasFromFn(size, fn){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size), d = img.data;
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){ const o=(y*size+x)*4, col=fn(x,y); d[o]=col[0]; d[o+1]=col[1]; d[o+2]=col[2]; d[o+3]=col[3]===undefined?255:col[3]; }
  g.putImageData(img, 0, 0); return c;
}
function toTex(c, srgb){ const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = MAXANI; if(srgb) t.encoding = THREE.sRGBEncoding; return t; }
function surfaceTex(size, hfn, colorFn, nStrength){
  const H = new Float32Array(size*size);
  for(let y=0;y<size;y++) for(let x=0;x<size;x++) H[y*size+x] = hfn(x/size, y/size);
  const at = (x,y) => H[((y+size)%size)*size + ((x+size)%size)];
  const map = toTex(canvasFromFn(size, (x,y) => colorFn(at(x,y), x, y)), true);
  const normal = toTex(canvasFromFn(size, (x,y) => {
    const dx = (at(x+1,y) - at(x-1,y))*nStrength, dy = (at(x,y+1) - at(x,y-1))*nStrength;
    const l = Math.hypot(dx, dy, 1);
    return [(-dx/l*0.5+0.5)*255, (dy/l*0.5+0.5)*255, (1/l*0.5+0.5)*255];
  }), false);
  return {map, normal};
}
const grey = v => { const g = clamp(v,0,1)*255; return [g,g,g]; };
const TEX = {};
TEX.ground = surfaceTex(256, (u,v) => 0.5 + 0.5*(0.5*tileN(u,v,6,6) + 0.3*tileN(u,v,17,17) + 0.2*tileN(u,v,46,46)), h => grey(0.80 + 0.22*h), 3.2);
TEX.rock = surfaceTex(256, (u,v) => 0.5 + 0.5*(0.45*tileN(u,v,3,12) + 0.3*tileN(u,v,9,28) + 0.25*tileN(u,v,30,60)), h => grey(0.66 + 0.4*h), 4.5);
TEX.gravel = surfaceTex(256, (u,v) => { const a = Math.abs(tileN(u,v,40,40)), b = Math.abs(tileN(u,v,23,23)); return 1 - Math.min(a,b)*1.6; },
  (h,x,y) => { const t = clamp(h,0,1), j = tileN(x/256,y/256,60,60)*18; return [118+t*70+j, 112+t*64+j, 102+t*58+j]; }, 5);
TEX.concrete = surfaceTex(256, (u,v) => 0.5 + 0.5*(0.6*tileN(u,v,8,8) + 0.4*tileN(u,v,50,50)), h => { const g = 168 + h*40; return [g, g-2, g-6]; }, 1.2);
TEX.asphalt = surfaceTex(256, (u,v) => 0.5 + 0.5*(0.5*tileN(u,v,10,10) + 0.5*tileN(u,v,70,70)), h => { const g = 62 + h*26; return [g, g, g+3]; }, 1.5);
TEX.bark = surfaceTex(128, (u,v) => 0.5 + 0.5*(0.6*tileN(u,v,12,2) + 0.4*tileN(u,v,30,6)), h => grey(0.55 + 0.5*h), 3);

function softSpriteTex(puffs, seedShift){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  for(let i=0;i<puffs;i++){
    const a = R(0,TAU), r = Math.sqrt(rnd())*70, x = 128 + Math.cos(a)*r, y = 128 + Math.sin(a)*r*0.75, s = R(30, 70) * (1 - r/140);
    const grd = g.createRadialGradient(x,y,0,x,y,s);
    grd.addColorStop(0, 'rgba(255,255,255,0.55)'); grd.addColorStop(0.5, 'rgba(255,255,255,0.25)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x,y,s,0,TAU); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
TEX.cloud = [softSpriteTex(26), softSpriteTex(34), softSpriteTex(20)];
TEX.puff = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const grd = g.createRadialGradient(64,64,0,64,64,64); grd.addColorStop(0,'rgba(255,255,255,0.9)'); grd.addColorStop(0.45,'rgba(255,255,255,0.45)'); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0,0,128,128); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; })();

/* ---------- shared materials ---------- */
function std(opts){ return new THREE.MeshStandardMaterial(Object.assign({roughness:0.8, metalness:0}, opts)); }
const MAT = {
  steel: std({color:new THREE.Color('#5d656d'), metalness:0.75, roughness:0.42}),
  rail: std({color:new THREE.Color('#8b8e92'), metalness:0.9, roughness:0.32}),
  archPaint: std({color:new THREE.Color('#6f3226'), metalness:0.45, roughness:0.5}),
  sleeper: std({color:new THREE.Color('#4a3b2e'), roughness:0.92, map:TEX.bark.map}),
  ballast: std({color:new THREE.Color('#ffffff'), roughness:0.95, map:TEX.gravel.map, normalMap:TEX.gravel.normal}),
  concrete: std({color:new THREE.Color('#ffffff'), roughness:0.9, map:TEX.concrete.map, normalMap:TEX.concrete.normal, normalScale:new THREE.Vector2(0.4,0.4)}),
  asphalt: std({color:new THREE.Color('#ffffff'), roughness:0.95, map:TEX.asphalt.map}),
  paving: std({color:new THREE.Color('#d8d0c2'), roughness:0.85, map:TEX.concrete.map}),
  glass: std({color:new THREE.Color('#1c2a36'), metalness:0.2, roughness:0.06}),
  darkMetal: std({color:new THREE.Color('#2b2f33'), metalness:0.6, roughness:0.45}),
  wood: std({color:new THREE.Color('#7a5a3c'), roughness:0.8, map:TEX.bark.map}),
  white: std({color:new THREE.Color('#eef0ee'), roughness:0.55}),
  stone: std({color:new THREE.Color('#a39d92'), roughness:0.9, map:TEX.rock.map, normalMap:TEX.rock.normal}),
};
MAT.ballast.map.repeat.set(1,1);
function mesh(geo, mat, x=0,y=0,z=0, parent){ const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; (parent||scene).add(m); return m; }

/* ---------- islands ---------- */
const ISL = [
  {name:'まちのえき', romaji:'MACHI', kind:'town',  x:-118, z:100,  y:0,  R:62, side:1,  flat:[4,11]},
  {name:'やまのえき', romaji:'YAMA',  kind:'mount', x:-112, z:-112, y:14, R:56, side:-1, flat:[5,26]},
  {name:'うみのえき', romaji:'UMI',   kind:'sea',   x:122,  z:-116, y:-8, R:68, side:-1, flat:[4,12]},
  {name:'もりのえき', romaji:'MORI',  kind:'park',  x:114,  z:112,  y:6,  R:54, side:-1, flat:[4,12]},
];
const MINI = [
  {kind:'mini', x:6,    z:-4,   y:48,  R:22},
  {kind:'rock', x:-10,  z:238,  y:-22, R:10},
  {kind:'rock', x:262,  z:2,    y:24,  R:9},
  {kind:'rock', x:-262, z:-8,   y:-12, R:11},
  {kind:'rock', x:22,   z:-252, y:30,  R:8},
  {kind:'rock', x:-44,  z:46,   y:-46, R:7},
];
const ALL = [...ISL, ...MINI];
ALL.forEach(i => { i.p = [R(0,TAU), R(0,TAU), R(0,TAU)]; i.sd = R(0,100); });
function rimR(isl, th){ const p = isl.p; return isl.R*(1 + 0.08*Math.sin(3*th+p[0]) + 0.05*Math.sin(5*th+p[1]) + 0.03*Math.sin(9*th+p[2])); }
function inside(isl, x, z, m){ const dx = x-isl.x, dz = z-isl.z; return Math.hypot(dx,dz) < rimR(isl, Math.atan2(dz,dx)) - m; }

/* ---------- track path ---------- */
const RAIL = 0.75;
const ctrl = [];
ISL.forEach((isl, i) => {
  const prev = ISL[(i+3)%4], next = ISL[(i+1)%4];
  const d = new THREE.Vector2(next.x-prev.x, next.z-prev.z).normalize();
  const inward = new THREE.Vector2(-isl.x, -isl.z).normalize().multiplyScalar(isl.R*0.18);
  [-0.56, 0, 0.56].forEach(f => ctrl.push(new THREE.Vector3(isl.x + inward.x + d.x*isl.R*f, isl.y + RAIL, isl.z + inward.y + d.y*isl.R*f)));
});
const curve = new THREE.CatmullRomCurve3(ctrl, true, 'centripetal');
const NS = 5000;
const P = curve.getSpacedPoints(NS).slice(0, NS);
const landOf = P.map(p => ISL.findIndex(isl => inside(isl, p.x, p.z, 1.0)));
P.forEach((p,k) => { if(landOf[k] >= 0) p.y = ISL[landOf[k]].y + RAIL; });
for(let pass=0; pass<60; pass++){
  const ys = P.map(p => p.y);
  for(let k=0;k<NS;k++){ if(landOf[k] >= 0) continue; P[k].y = (ys[(k-2+NS)%NS] + ys[(k-1+NS)%NS] + ys[k] + ys[(k+1)%NS] + ys[(k+2)%NS]) / 5; }
}
const L = new Float32Array(NS+1);
for(let k=1;k<=NS;k++) L[k] = L[k-1] + P[k-1].distanceTo(P[k%NS]);
const TOTAL = L[NS];
function idxAt(s){ s = ((s % TOTAL) + TOTAL) % TOTAL; let lo = 0, hi = NS; while(hi - lo > 1){ const m = (lo+hi) >> 1; if(L[m] <= s) lo = m; else hi = m; } return [lo, (s - L[lo]) / (L[lo+1] - L[lo])]; }
function at(s, out){ const [i,f] = idxAt(s); return (out || new THREE.Vector3()).lerpVectors(P[i], P[(i+1)%NS], f); }
function tangentAt(s){ return at(s+1).sub(at(s-1)).normalize(); }
// frames
const TAN = [], SIDE = [], UP = [];
for(let k=0;k<NS;k++){
  const t = new THREE.Vector3().subVectors(P[(k+1)%NS], P[(k-1+NS)%NS]).normalize();
  const sd = new THREE.Vector3(-t.z, 0, t.x).normalize();
  TAN.push(t); SIDE.push(sd); UP.push(new THREE.Vector3().crossVectors(sd, t).normalize());
}

/* ---------- stations & feature anchors ---------- */
const stations = ISL.map((isl, i) => {
  let best = -1, bd = 1e9;
  for(let k=0;k<NS;k++) if(landOf[k] === i){ const d = Math.hypot(P[k].x-isl.x, P[k].z-isl.z); if(d < bd){ bd = d; best = k; } }
  const s = L[best], p = at(s), t = tangentAt(s); t.y = 0; t.normalize();
  const n = new THREE.Vector3(-t.z, 0, t.x);
  // measure how much land lies on each side of the track here; the town gets the roomier side
  let pos = 0, neg = 0;
  for(let u=-50; u<=50; u+=5) for(let w=6; w<=90; w+=5){ const bx = p.x + t.x*u, bz = p.z + t.z*u; if(inside(isl, bx + n.x*w, bz + n.z*w, 6)) pos++; if(inside(isl, bx - n.x*w, bz - n.z*w, 6)) neg++; }
  if(neg > pos) n.negate();
  n.multiplyScalar(isl.side);
  isl.st = {s, p, t, n, ry: Math.atan2(t.x, t.z)};
  isl.away = n.clone().negate();
  return {name: isl.name, s, stopS: s + 28};
});

function sweepBox(ids, pts, sides, ups, ox, oy, w, h, closed, uvLen=4){
  const faces = [
    [[-w/2, h/2], [w/2, h/2], [0, 1]],
    [[w/2, h/2], [w/2, -h/2], [1, 0]],
    [[w/2, -h/2], [-w/2, -h/2], [0, -1]],
    [[-w/2, -h/2], [-w/2, h/2], [-1, 0]],
  ];
  const n = ids.length, rows = closed ? n + 1 : n;
  const pos = [], nor = [], uv = [], idx = [];
  const acc = [0]; for(let i=1;i<rows;i++){ const a = pts[ids[(i-1)%n]], b = pts[ids[i%n]]; acc.push(acc[i-1] + a.distanceTo(b)); }
  faces.forEach(([A, B, N]) => {
    const base = pos.length/3;
    for(let i=0;i<rows;i++){
      const k = ids[i%n], p = pts[k], sd = sides[k], up = ups[k];
      const nx = sd.x*N[0] + up.x*N[1], ny = sd.y*N[0] + up.y*N[1], nz = sd.z*N[0] + up.z*N[1];
      [A, B].forEach(([a, b], q) => {
        pos.push(p.x + sd.x*(ox+a) + up.x*(oy+b), p.y + sd.y*(ox+a) + up.y*(oy+b), p.z + sd.z*(ox+a) + up.z*(oy+b));
        nor.push(nx, ny, nz); uv.push(acc[i]/uvLen, q);
      });
    }
    for(let i=0;i<rows-1;i++){ const a = base + i*2, b = a + 1, c = a + 2, d = a + 3; idx.push(a, b, c, b, d, c); }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); return g;
}
function framesFor(pts){
  const sides = [], ups = [];
  for(let i=0;i<pts.length;i++){
    const a = pts[Math.max(0,i-1)], b = pts[Math.min(pts.length-1, i+1)];
    const t = new THREE.Vector3().subVectors(b, a).normalize();
    const sd = new THREE.Vector3(-t.z, 0, t.x).normalize();
    sides.push(sd); ups.push(new THREE.Vector3().crossVectors(sd, t).normalize());
  }
  return {sides, ups};
}

  const ends = new THREE.BufferGeometry();

function colorize(g, fn){ const p = g.attributes.position, col = new Float32Array(p.count*3), c = new THREE.Color(); for(let i=0;i<p.count;i++){ fn(p.getX(i), p.getY(i), p.getZ(i), c); col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b; } g.setAttribute('color', new THREE.BufferAttribute(col, 3)); return g; }
function clean(g){ g = g.index ? g.toNonIndexed() : g; for(const k of Object.keys(g.attributes)) if(!['position','normal','color'].includes(k)) g.deleteAttribute(k); return g; }
function blob(r, detail, amp, freq, sd, sy=1){
  let g = new THREE.IcosahedronGeometry(r, detail); g.deleteAttribute('uv'); g.deleteAttribute('normal'); g = BGU.mergeVertices(g);
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++){ const x = p.getX(i), y = p.getY(i), z = p.getZ(i); const k = 1 + amp*SN.noise3d(x*freq + sd, y*freq - sd, z*freq); p.setXYZ(i, x*k, y*k*sy, z*k); }
  g.computeVertexNormals(); return g;
}
const merge = list => BGU.mergeBufferGeometries(list.map(clean));
const BARK = C('#4f3f30');
function makeDeciduous(sd, leafA, leafB){

  parts.push(colorize(trunk, (x,y,z,c) => c.copy(BARK).multiplyScalar(0.8 + 0.3*rnd())));
  for(let b=0;b<3;b++){ const br = new THREE.CylinderGeometry(0.07, 0.15, 2.4, 5); br.translate(0, 1.2, 0); br.rotateZ(0.7); br.rotateY(b*2.1 + sd); br.translate(0, 3.3, 0); parts.push(colorize(br, (x,y,z,c) => c.copy(BARK))); }
  const n = 7;
  for(let i=0;i<n;i++){
    const a = i/n*TAU + sd, rr = i === 0 ? 0 : R(1.1, 2.0), cy = i === 0 ? 6.4 : R(4.8, 6.6);
    const b = blob(R(1.5, 2.2), 2, 0.28, 0.85, sd*7 + i);
    b.translate(Math.cos(a)*rr, cy, Math.sin(a)*rr);
    parts.push(colorize(b, (x,y,z,c) => { const k = SN.noise3d(x*0.7+sd, y*0.7, z*0.7); c.copy(leafA).lerp(leafB, clamp(0.5 + k*0.7, 0, 1)).multiplyScalar(0.5 + 0.55*sstep(3.6, 7.6, y)); }));
  }

}
function makeConifer(sd){

const LAG = (() => {
  const isl = ISL[2], Lk = isl.lake, lv = isl.y + Lk.level;
  const ext = Lk.r*1.25, step = 1, N = Math.ceil(2*ext/step) + 1, g = new Float32Array(N*N);
  for(let j=0;j<N;j++) for(let i=0;i<N;i++) g[j*N+i] = groundY(isl, Lk.x - ext + i*step, Lk.z - ext + j*step);
  const bed = (x, z) => {
    const fx = (x - Lk.x + ext)/step, fz = (z - Lk.z + ext)/step, i = Math.floor(fx), j = Math.floor(fz);
    if(i < 0 || j < 0 || i >= N-1 || j >= N-1) return lv + 5;
    const u = fx - i, v = fz - j;
    return lerp(lerp(g[j*N+i], g[j*N+i+1], u), lerp(g[(j+1)*N+i], g[(j+1)*N+i+1], u), v);
  };
  return {isl, Lk, lv, bed, cx: Lk.x, cz: Lk.z, r: Lk.r};
})();
const depthAt = (x, z) => LAG.lv - LAG.bed(x, z);
function lagoonSpot(minD, maxD, maxR){

function sway(material, amp, speed){

    sh.uniforms.uTime = U.time;
    sh.vertexShader = 'attribute float aPh; uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      float hgt = max(position.y, 0.0);
      transformed.x += sin(uTime*${speed.toFixed(2)} + aPh + hgt*0.7)*${amp.toFixed(3)}*hgt*hgt;
      transformed.z += cos(uTime*${(speed*0.8).toFixed(2)} + aPh*1.3 + hgt*0.5)*${(amp*0.7).toFixed(3)}*hgt*hgt;`);
  };
  return material;
}

  const coal = mesh(new THREE.BoxGeometry(2.5, 0.4, 4.2), std({color:new THREE.Color('#0d0d0e'), roughness:0.95, normalMap:TEX.gravel.normal}), 0, 3.5, 0.6, g);
  wheels = wheels.concat(bogie(g, -2.2), bogie(g, 2.2));
  return {g, wheels, len: 6.8};
}
function makeCar(){
  const g = new THREE.Group(); let wheels = [];
  mesh(new THREE.BoxGeometry(2.8, 2.7, 13), [carPlain, carPlain, carPlain, carPlain, carPlain, carPlain].map((m, i) => i < 2 ? TM.carGreen : m), 0, 2.55, 0, g);
  const roof = mesh(new THREE.CylinderGeometry(1, 1, 13.3, 24), TM.roof, 0, 3.9, 0, g); roof.rotation.x = Math.PI/2; roof.scale.set(1.5, 1, 0.42);
  mesh(new THREE.BoxGeometry(2.0, 2.3, 0.5), std({color:new THREE.Color('#1b1b1b'), roughness:0.9}), 0, 2.45, 6.7, g);
  wheels = wheels.concat(bogie(g, -4.6), bogie(g, 4.6));
  return {g, wheels, len: 13.2};
}
const train = [makeLoco(), makeTender(), makeCar(), makeCar(), makeCar()];
train.forEach(u => scene.add(u.g));
const offsets = []; { let o = 0; train.forEach((u,i) => { if(i) o -= train[i-1].len/2 + 0.6 + u.len/2; offsets.push(o); }); }
const smoke = [];
{
  for(let i=0;i<70;i++){ const s = new THREE.Sprite(new THREE.SpriteMaterial({map:TEX.puff, color:new THREE.Color('#d8d8d6'), transparent:true, opacity:0, depthWrite:false})); s.visible = false; scene.add(s); smoke.push({s, life:0, v:new THREE.Vector3()}); }
}
let smokeIdx = 0, smokeAcc = 0;

/* ---------- train motion ---------- */
let s = stations[0].stopS - 140, v = 0, state = 'run', waitT = 0, lastStation = -1, prevNext = null, wheelA = 0;
const VMAX = 22, ACC = 2.6, DEC = 2.3;
const aheadDist = target => ((target - s) % TOTAL + TOTAL) % TOTAL;
function nextStation(){ let bi = 0, bd = 1e9; stations.forEach((st,i) => { const d = aheadDist(st.stopS); if(i === lastStation && (d < 5 || d > TOTAL - 120)) return; if(d < bd){ bd = d; bi = i; } }); return {i: bi, d: bd}; }
const statusEl = document.getElementById('status'), lampEl = document.getElementById('lamp');
let lastStatus = '';
function setStatus(txt, stop){ if(txt !== lastStatus){ statusEl.textContent = txt; lampEl.classList.toggle('stop', !!stop); lastStatus = txt; } }
const q1 = new THREE.Vector3(), q2 = new THREE.Vector3(), mid = new THREE.Vector3();
function placeTrain(dt){
  wheelA += v*dt;
  train.forEach((u, i) => {
    const sc = s + offsets[i], half = Math.min(4.5, u.len*0.36);
    at(sc + half, q1); at(sc - half, q2); mid.addVectors(q1, q2).multiplyScalar(0.5);
    u.g.position.copy(mid); u.g.lookAt(q1.x, mid.y + (q1.y - q2.y)*0.5, q1.z);
    u.wheels.forEach(w => { w.m.rotation.x = wheelA/w.r; });
    if(u.rods){ const a = wheelA/1.0; u.rods.forEach(r => { r.m.position.y = 1.0 + Math.sin(a)*0.45; r.m.position.z = -0.6 + Math.cos(a)*0.45; }); }
  });
}

/* ---------- camera modes ---------- */
let mode = 'orbit';
const btns = {orbit:'v-orbit', follow:'v-follow', cab:'v-cab', sea:'v-sea'};
Object.keys(btns).forEach(k => { btns[k] = document.getElementById(btns[k]); btns[k].addEventListener('click', () => setMode(k)); });
const SEA_FIT = LAG.r*0.62;
function setMode(k){
  const prev = mode; mode = k;
  Object.entries(btns).forEach(([kk, b]) => b.setAttribute('aria-pressed', String(kk === k)));
  controls.enabled = k === 'orbit' || k === 'sea';
  if(k === 'sea'){
    controls.target.set(LAG.cx, LAG.lv - 5.5, LAG.cz);
    camera.position.set(LAG.cx + SEA_FIT*0.7, LAG.lv - 4.5, LAG.cz + SEA_FIT*0.3);
    Object.assign(controls, {minDistance:3, maxDistance:SEA_FIT, minPolarAngle:1.15, maxPolarAngle:2.0, autoRotate:!reduceMotion, autoRotateSpeed:0.5});
  } else if(k === 'orbit'){
    Object.assign(controls, {minDistance:25, maxDistance:1300, minPolarAngle:0, maxPolarAngle:Math.PI*0.64, autoRotateSpeed:0.25});
    if(prev === 'sea'){ const isl = ISL[2]; controls.target.set(isl.x, isl.y - 6, isl.z); camera.position.set(isl.x + 95, isl.y + 70, isl.z + 120); }
    else { const tp = train[0].g.position; controls.target.set(tp.x*0.4, -20, tp.z*0.4); camera.position.set(tp.x*0.4 + 300, 170, tp.z*0.4 + 330); }
  }
}
let paused = false;
const pauseBtn = document.getElementById('pause');
pauseBtn.addEventListener('click', () => { paused = !paused; pauseBtn.textContent = paused ? '再開' : '一時停止'; pauseBtn.setAttribute('aria-pressed', String(paused)); });
const camLook = new THREE.Vector3().copy(controls.target), camTmp = new THREE.Vector3();
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.fov = w < h ? 60 : 45; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

let underwater = false;
function checkUnderwater(){
  const p = camera.position, u = Math.hypot(p.x - LAG.cx, p.z - LAG.cz) < LAG.r*1.15 && p.y < LAG.lv - 0.05 && p.y > LAG.bed(p.x, p.z) - 1;
  if(u !== underwater){
    underwater = u;
    scene.fog.color.copy(u ? WATERFOG.col : AIR.col); scene.fog.density = u ? WATERFOG.density : AIR.density;
    scene.background = u ? WATERFOG.col.clone() : null; sky.visible = !u; underOnly.visible = u;
    renderer.toneMappingExposure = u ? 0.75 : 0.6;
  }
}

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let T = 0;
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3(), mtx = new THREE.Matrix4(), ORIGIN = new THREE.Vector3(), UPV = new THREE.Vector3(0,1,0), ob = new THREE.Object3D();
function updateSea(dt){
  // boids
  const S = SCHOOL, n = S.length, lead = tmpV2.set(LAG.cx + Math.cos(T*0.12)*LAG.r*0.45, LAG.lv - 5 + Math.sin(T*0.3)*1.5, LAG.cz + Math.sin(T*0.12)*LAG.r*0.45);
  for(let i=0;i<n;i++){
    const f = S[i], acc = tmpV.set(0,0,0);
    let cx=0, cy=0, cz=0, vx=0, vy=0, vz=0, cnt=0;
    for(let j=0;j<n;j++){ if(i === j) continue; const o = S[j]; const dx = o.p.x - f.p.x, dy = o.p.y - f.p.y, dz = o.p.z - f.p.z, d2 = dx*dx + dy*dy + dz*dz;
      if(d2 < 9){ cnt++; cx += o.p.x; cy += o.p.y; cz += o.p.z; vx += o.v.x; vy += o.v.y; vz += o.v.z; if(d2 < 0.36){ const k = 1.6/(d2 + 0.05); acc.x -= dx*k; acc.y -= dy*k; acc.z -= dz*k; } } }
    if(cnt){ acc.x += (cx/cnt - f.p.x)*0.6 + (vx/cnt - f.v.x)*0.9; acc.y += (cy/cnt - f.p.y)*0.6 + (vy/cnt - f.v.y)*0.9; acc.z += (cz/cnt - f.p.z)*0.6 + (vz/cnt - f.v.z)*0.9; }
    acc.x += (lead.x - f.p.x)*0.08; acc.y += (lead.y - f.p.y)*0.12; acc.z += (lead.z - f.p.z)*0.08;
    const floor = LAG.bed(f.p.x, f.p.z) + 1.0; if(f.p.y < floor + 0.8) acc.y += (floor + 0.8 - f.p.y)*6; if(f.p.y > LAG.lv - 1.0) acc.y -= (f.p.y - LAG.lv + 1.0)*6;
    if(LAG.lv - LAG.bed(f.p.x, f.p.z) < 2.5){ acc.x += (LAG.cx - f.p.x)*0.5; acc.z += (LAG.cz - f.p.z)*0.5; }
    f.v.addScaledVector(acc, dt); const sp = f.v.length(); if(sp > 4.5) f.v.multiplyScalar(4.5/sp); else if(sp < 1.8) f.v.multiplyScalar(1.8/Math.max(sp, 0.01));
    f.p.addScaledVector(f.v, dt);
    mtx.lookAt(f.v, ORIGIN, UPV); mtx.setPosition(f.p); LAG.school.setMatrixAt(i, mtx);
  }
  LAG.school.instanceMatrix.needsUpdate = true;
  REEF.forEach(({m, list}) => { list.forEach((f, i) => {
    const a = T*f.sp + f.ph, x = f.home[0] + Math.cos(a)*f.r, z = f.home[2] + Math.sin(a)*f.r;
    const y = Math.max(LAG.bed(x, z) + 0.5, f.home[1] + f.hy + Math.sin(T*0.7 + f.ph)*0.4);
    tmpV.set(-Math.sin(a)*Math.sign(f.sp), 0, Math.cos(a)*Math.sign(f.sp));
    mtx.lookAt(tmpV, ORIGIN, UPV); mtx.setPosition(x, Math.min(y, LAG.lv - 0.6), z); m.setMatrixAt(i, mtx);
  }); m.instanceMatrix.needsUpdate = true; });
  // turtle, ray
  { const a = -T*0.05, r = LAG.r*0.5; turtle.g.position.set(LAG.cx + Math.cos(a)*r, LAG.lv - 4.5 + Math.sin(T*0.2)*1.2, LAG.cz + Math.sin(a)*r*0.8);
    turtle.g.rotation.y = Math.atan2(Math.sin(a), -Math.cos(a)*0.8); turtle.g.rotation.z = Math.sin(T*0.5)*0.06;
    turtle.flips.forEach(f => { f.piv.rotation.z = f.s*Math.sin(T*1.3 + (f.big ? 0 : 1.5))*(f.big ? 0.5 : 0.25); f.piv.rotation.y = f.s*Math.cos(T*1.3)*0.2*(f.big ? 1 : 0); }); }
  { const a = T*0.035 + 2, r = LAG.r*0.62, x = LAG.cx + Math.cos(a)*r, z = LAG.cz + Math.sin(a*1.3)*r*0.7; const y = Math.max(LAG.bed(x, z) + 1.4, LAG.lv - 9);
    const nx = LAG.cx + Math.cos(a + 0.02)*r, nz = LAG.cz + Math.sin((a + 0.02)*1.3)*r*0.7; ray.position.set(x, y, z); ray.lookAt(nx, y, nz); }
  // bubbles
  if(rnd() < dt*3){ const b = bubbles.find(b => !b.m.visible); const sp = lagoonSpot(3, 14, 0.8); if(b && sp){ b.m.visible = true; b.m.position.set(sp[0], sp[1] + 0.2, sp[2]); b.x0 = sp[0]; b.v = R(0.8, 1.4); b.ph = R(0,TAU); b.m.scale.setScalar(R(0.04, 0.1)); } }
  bubbles.forEach(b => { if(!b.m.visible) return; b.m.position.y += b.v*dt; b.m.position.x = b.x0 + Math.sin(T*3 + b.ph)*0.1; if(b.m.position.y > LAG.lv - 0.1) b.m.visible = false; });
  if(underwater){ LAG.snow.position.y = Math.sin(T*0.1)*0.3; LAG.rayMat.opacity = 0.02 + Math.sin(T*0.6)*0.008; }
}
function tick(){
  const dtr = Math.min(clock.getDelta(), 0.05), dt = paused ? 0 : dtr;
  T += dt; U.time.value = T;
  const nx = nextStation();
  if(state === 'run'){
    const target = Math.min(VMAX, Math.sqrt(2*DEC*Math.max(0, nx.d)) + 0.3);
    if(v < target) v = Math.min(target, v + ACC*dt); else v = Math.max(target, v - DEC*1.8*dt);
    s += v*dt;
    const over = prevNext && prevNext.i !== lastStation && aheadDist(stations[prevNext.i].stopS) > TOTAL - 5;
    if(nx.d < 0.1 || over){ if(over) nx.i = prevNext.i; state = 'stop'; waitT = 4; v = 0; lastStation = nx.i; s = stations[nx.i].stopS; }
    setStatus(nx.d < 90 ? `まもなく ${stations[nx.i].name}` : `つぎは ${stations[nx.i].name}`, false);
    prevNext = state === 'run' ? nx : null;
  } else {
    waitT -= dt; setStatus(`${stations[lastStation].name} に停車中`, true);
    if(waitT <= 0) state = 'run';
  }
  placeTrain(dt);
  // smoke
  const loco = train[0];
  smokeAcc += dt*(state === 'run' ? 5 + v*0.6 : 1.5);
  while(smokeAcc > 1){ smokeAcc -= 1; const p = smoke[smokeIdx++ % smoke.length]; p.s.position.copy(loco.chimney); loco.g.localToWorld(p.s.position); p.v.set(R(-0.5,0.5), R(3,4.5), R(-0.5,0.5)); p.life = 1; p.s.visible = true; }
  smoke.forEach(p => { if(p.life <= 0) return; p.life -= dt*0.32; p.s.position.addScaledVector(p.v, dt); p.v.multiplyScalar(1 - dt*0.5); p.s.position.x += dt*1.2; const sc = 1.2 + (1 - p.life)*9; p.s.scale.set(sc, sc, 1); p.s.material.opacity = Math.max(0, p.life)*0.7; if(p.life <= 0) p.s.visible = false; });
  // ambient motion
  mistSprites.forEach(m => { if(m.k < 0){ const a = m.ph + T*2.2, r = ((T*0.9 + m.ph) % 1); m.s.position.set(m.base.x + Math.cos(a)*r*1.4, m.base.y + Math.sin(r*Math.PI)*2.2, m.base.z + Math.sin(a)*r*1.4); m.s.material.opacity = 0.35*(1 - r); } else { m.s.position.set(m.base.x + Math.sin(T*0.4 + m.ph)*m.k*0.5, m.base.y + Math.sin(T*0.3 + m.ph)*m.k*0.4, m.base.z + Math.cos(T*0.35 + m.ph)*m.k*0.5); } });
  if(wheel){ wheel.rotation.x += dt*0.09; gondolas.forEach(g => g.rotation.x = -wheel.rotation.x); }
  if(windmillHub) windmillHub.userData.spin.rotation.z -= dt*0.5;
  if(lighthousePivot) lighthousePivot.rotation.y += dt*0.6;
  boats.forEach(b => { b.g.position.y = b.y + Math.sin(T*1.1 + b.ph)*0.06; b.g.rotation.z = Math.sin(T*0.9 + b.ph)*0.04; b.g.rotation.x = Math.sin(T*0.7 + b.ph)*0.02; });
  balloons.forEach(b => { const a = T*0.012 + b.ph; b.g.position.set(Math.cos(a)*b.r, b.y + Math.sin(T*0.2 + b.ph)*3, Math.sin(a)*b.r); });
  flocks.forEach(F => { F.birds.forEach((b, i) => { const a = T*b.sp + b.ph; ob.position.set(F.isl.x + Math.cos(a)*b.r, F.isl.y + F.h + b.y + Math.sin(T*0.5 + b.ph)*2, F.isl.z + Math.sin(a)*b.r); ob.rotation.set(0, -a, Math.sin(T*0.3 + b.ph)*0.2); ob.scale.setScalar(b.s); ob.updateMatrix(); F.im.setMatrixAt(i, ob.matrix); }); F.im.instanceMatrix.needsUpdate = true; });
  cloudGroup.rotation.y += dt*0.002;
  updateSea(dt);
  // camera
  if(mode === 'follow' || mode === 'cab'){
    const fwd = tangentAt(s), lp = loco.g.position;
    if(mode === 'follow'){
      const side = new THREE.Vector3(-fwd.z, 0, fwd.x).normalize();
      camTmp.copy(lp).addScaledVector(fwd, -34).addScaledVector(side, 12).add(tmpV.set(0, 13, 0));
      camera.position.lerp(camTmp, 1 - Math.exp(-dtr*2.2));
      camLook.lerp(tmpV.copy(lp).addScaledVector(fwd, 10).add(tmpV2.set(0, 2, 0)), 1 - Math.exp(-dtr*4));
    } else {
      camTmp.copy(loco.cabEye); loco.g.localToWorld(camTmp); camera.position.copy(camTmp);
      tmpV.set(0.2, 3.6, 60); loco.g.localToWorld(tmpV); camLook.lerp(tmpV, 1 - Math.exp(-dtr*6));
    }
    camera.lookAt(camLook);
  } else controls.update();
  checkUnderwater();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
document.getElementById('loading').classList.add('done');
tick();
})();
</script>

tton{border:0;background:#fff;color:#384865;border-radius:20px;padding:6px 17px}.tabs button.video{background:#f1e7ff;color:#7943bb}.tabs button.image{background:#fff0dd;color:#ad5800}.tabs button.design{background:#ffe6f0;color:#c1306b}.tabs button.code{background:#e0eeff;color:#2464b5}.tabs button[aria-pressed=true]{background:var(--accent);color:#fff}.tabs button.video[aria-pressed=true]{background:#7943bb;color:#fff}.tabs button.image[aria-pressed=true]{background:#ad5800;color:#fff}.tabs button.design[aria-pressed=true]{background:#c1306b;color:#fff}.tabs button.code[aria-pressed=true]{background:#2464b5;color:#fff}.search{margin-left:auto;flex:1;max-width:310px;min-width:180px}input,select{background:#fff;border:1px solid #d8e0ef;border-radius:7px;color:#40516d;padding:8px 12px;width:100%}select{width:auto;max-width:190px}.count{font-size:11px;color:var(--muted)}.more-wrap{text-align:center;margin:28px 0 0}.more{background:#fff;color:#3847a2;border:0;padding:11px 35px;border-radius:8px}.message{color:#64718b;font-size:12px;margin:18px 0}.message.error{background:#fff3e4;padding:20px;border-radius:8px;color:#76552e}.empty{grid-column:1/-1;padding:35px 0;color:var(--muted)}.note{font-size:11px;color:#7b879a;margin-top:26px}.hide{display:none!important}@media(min-width:900px){.article-grid .content{padding:20px 23px}.article-grid h3,.pickup-grid h3{font-size:20px}}@media(max-width:1000px){.pickup-grid,.article-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pickup-grid .card:last-child{grid-column:1/-1;max-width:calc(50% - 11px)}nav,main{padding-left:24px;padding-right:24px}.search{margin-left:0}.toolbar h2{width:100%}}@media(max-width:620px){nav,main{padding-left:18px;padding-right:18px}nav{min-height:62px}.brand{gap:8px}.brand strong{font-size:22px}.brand span{font-size:10px}nav .ghost{font-size:12px;padding:6px 9px}h1,h2{font-size:22px}.pickup-grid,.article-grid{grid-template-columns:1fr;gap:16px}.pickup-grid .card:last-child{grid-column:auto;max-width:none}.thumb{aspect-ratio:2/1}.heading{align-items:baseline}.toolbar{gap:12px}.tabs{width:100%;gap:5px}.tabs button{padding:6px 12px;font-size:12px}.search{max-width:none;flex-basis:100%}.count{margin-left:auto}.content{padding:18px}.article-grid dd{font-size:14px}.date{font-size:10px}}@media(prefers-reduced-motion:no-preference){.card{transition:box-shadow .2s}.card:hover{box-shadow:0 5px 22px #2439770a}}

</style></head><body><header><nav><div class="brand"><strong>AI NOTE</strong><span>制作のひきだし</span></div><button class="ghost" id="saved" aria-pressed="false">あとで見る</button></nav></header><main><section id="pickup-section"><div class="heading"><h1>今週のピックアップ</h1><span class="muted" id="updated"></span></div><div class="pickup-grid" id="pickups"></div></section><section><div class="toolbar"><h2 id="list-title">すべての記事</h2><div class="tabs" id="tabs" aria-label="分野で絞り込み"></div><div class="search"><input type="search" id="search" placeholder="キーワードで検索" aria-label="キーワードで検索"></div><select id="period" aria-label="取得日で絞り込み"><option value="">すべての取得日</option></select><span class="count" id="count" role="status"></span></div><p id="message" class="message" role="status">シートから記事を読み込み中…</p><div class="article-grid" id="articles"></div><div class="more-wrap"><button class="more hide" id="more">もっと見る（次の10件）</button></div></section><p class="note">「あとで見る」はこの端末・ブラウザに保存されます。画像はピックアップのみ表示。取得日と元記事の公開日は異なります。</p></main><script>
'use strict';
const SHEET_ID='17xGFGzWSabkZTb9093i1MedLYwS0nYSCCpOfaC1CGP8',PAGE_SIZE=10;
const $=s=>document.querySelector(s),el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n};
let entries=[],category='すべて',savedOnly=false,limit=PAGE_SIZE,saved=new Set,finished=false;
try{const v=JSON.parse(localStorage.getItem('ai-note-saved')||'[]');if(Array.isArray(v))saved=new Set(v)}catch{}
const categories=['すべて','動画','画像','デザイン','コード'];
function kind(c){return /動画/.test(c)?'video':/画像/.test(c)?'image':/デザイン/.test(c)?'design':/コード|コーディング/.test(c)?'code':''}
function normalizeCategory(c){return kind(c)==='video'?'動画':kind(c)==='image'?'画像':kind(c)==='design'?'デザイン':kind(c)==='code'?'コード':c||'その他'}
function safeUrl(s){try{const u=new URL(s);return u.protocol==='https:'||u.protocol==='http:'?u.href:''}catch{return ''}}
function shortUrl(s){try{const u=new URL(s);const full=u.hostname+u.pathname;return Array.from(full).length>35?Array.from(full).slice(0,34).join('')+'…':full}catch{return ''}}
function bookmark(e){const b=el('button','bookmark');b.type='button';b.setAttribute('aria-label',saved.has(e.id)?'あとで見るから解除':'あとで見るに保存');b.setAttribute('aria-pressed',saved.has(e.id));b.title=saved.has(e.id)?'あとで見るから解除':'あとで見るに保存';b.innerHTML='<svg viewBox="0 0 18 22" aria-hidden="true"><path d="M3 2h12v18l-6-4-6 4Z"/></svg>';b.onclick=()=>{saved.has(e.id)?saved.delete(e.id):saved.add(e.id);try{localStorage.setItem('ai-note-saved',JSON.stringify([...saved]))}catch{}draw()};return b}
function source(e){const f=el('footer','source');if(!e.url){f.append(el('span','muted','元記事URLは未登録'));return f}const a=el('a','','元記事を見る ↗');a.href=e.url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label','元記事を見る：'+new URL(e.url).hostname);const u=el('span','url',shortUrl(e.url));u.title=e.url;f.append(a,u);return f}
function article(e,pickup=false){const card=el('article','card'+(pickup?' pickup':''));if(pickup){const t=el('div','thumb '+kind(e.category));const fallback=el('div','fallback',e.title);t.append(fallback);if(e.image){const img=el('img');img.src=e.image;img.alt=e.title+'のイメージ';img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{img.remove();t.querySelector('small').textContent='画像を表示できません'};t.append(img,el('small','','AI生成イメージ'))}else t.append(el('small','','テーマ表示・画像未登録'));card.append(t)}const c=el('div','content'),meta=el('div','meta');meta.append(el('span','badge '+kind(e.category),e.category),el('span','date','取得：'+e.date.replaceAll('-','.')),bookmark(e));c.append(meta,el('h3','',e.title),el('p','summary',e.summary));const tags=el('div','tags');e.tools.split(/[、,／\n]/).map(s=>s.trim()).filter(Boolean).forEach(t=>tags.append(el('span','tool',t)));c.append(tags);if(!pickup){const d=el('dl');for(const [label,value] of [['制作手順',e.steps],['工夫・課題',e.challenges],['実務への影響',e.impact],['仕事で試すなら',e.try],['提供条件・制約',e.conditions],['確認できた範囲',e.verified]]){if(value)d.append(el('dt','',label),el('dd','',value))}c.append(d)}c.append(source(e));card.append(c);return card}
function filtered(){const q=$('#search').value.trim().toLowerCase(),date=$('#period').value;return entries.filter(e=>(category==='すべて'||e.category===category)&&(!savedOnly||saved.has(e.id))&&(!date||e.date===date)&&(!q||Object.values(e).join(' ').toLowerCase().includes(q)))}
function draw(){const items=filtered(),visible=items.slice(0,limit);$('#articles').replaceChildren(...visible.map(e=>article(e)));if(!items.length)$('#articles').append(el('p','empty',finished?'該当する記事はありません。':'読み込みをお待ちください。'));$('#count').textContent=`全${items.length}件中 ${visible.length}件を表示`;$('#more').classList.toggle('hide',visible.length>=items.length);$('#more').textContent='もっと見る（次の'+Math.min(10,items.length-visible.length)+'件）';$('#list-title').textContent=savedOnly?'あとで見る':'すべての記事';$('#saved').setAttribute('aria-pressed',savedOnly);$('#saved').title=savedOnly?'すべての記事へ戻る':'保存した記事を表示';$('#saved').textContent=savedOnly?'すべての記事に戻る':'あとで見る';$('#pickup-section').classList.toggle('hide',savedOnly);const marked=entries.filter(e=>e.pickup),picks=(marked.length?marked:entries.filter(e=>e.date===entries[0]?.date)).slice(0,3);$('#pickups').replaceChildren(...picks.map(e=>article(e,true)));$('#updated').textContent=entries[0]?entries[0].date.replaceAll('-','.')+' 更新':'';$('#tabs').replaceChildren(...categories.map(cat=>{const b=el('button',kind(cat),cat);b.type='button';b.setAttribute('aria-pressed',category===cat);b.onclick=()=>{category=cat;limit=10;draw()};return b}))}
$('#search').oninput=()=>{limit=10;draw()};$('#period').onchange=()=>{limit=10;draw()};$('#saved').onclick=()=>{savedOnly=!savedOnly;limit=10;draw()};$('#more').onclick=()=>{limit+=10;draw()};
function parseDate(cell){if(!cell)return '';const raw=String(cell.v??''),m=raw.match(/^Date\((\d+),(\d+),(\d+)/);if(m)return `${m[1]}-${String(+m[2]+1).padStart(2,'0')}-${m[3].padStart(2,'0')}`;return String(cell.f??cell.v??'').replace(/[/.]/g,'-')}
function rowsToEntries(rows){return rows.map((r,i)=>{const c=r.c||[],t=n=>String(c[n]?.f??c[n]?.v??'').trim(),date=parseDate(c[0]),urls=t(7).match(/https?:\/\/[^\s]+/g)||[],url=safeUrl(urls.find(u=>/^https?:\/\/(x\.com|twitter\.com)\//.test(u))||urls[0]||''),title=t(8)||t(2);return {id:[date,t(2),t(3)].join('|'),date,category:normalizeCategory(t(1)),title,tools:t(9)||t(2),summary:t(3),impact:t(4),try:t(5),conditions:t(6),url,steps:t(10),challenges:t(11),verified:t(12),pickup:/^(1|true|yes|○|〇|対象)$/i.test(t(13)),image:safeUrl(t(14)),_row:i}}).filter(e=>e.title&&e.title!=='ツール名').sort((a,b)=>b.date.localeCompare(a.date)||b._row-a._row)}
window.receiveSheet=res=>{if(finished)return;if(res.status==='error'||!res.table){fail();return}finished=true;entries=rowsToEntries(res.table.rows||[]);const dates=[...new Set(entries.map(e=>e.date))];$('#period').replaceChildren(new Option('すべての取得日',''),...dates.map(d=>new Option(d.replaceAll('-','.'),d)));$('#message').textContent=entries.length?'':'接続できました。記事が追加されるとここに表示されます。';draw()};
function fail(){if(finished)return;finished=true;$('#message').classList.add('error');$('#message').textContent='シートを読み込めませんでした。通信状況とシートの共有設定をご確認のうえ、ページを再読み込みしてください。';draw()}
draw();const script=document.createElement('script');script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=0&headers=1&tqx=out:json;responseHandler:receiveSheet&_=${Date.now()}`;script.onerror=fail;document.head.append(script);setTimeout(fail,20000);
</script></body></html>
